<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Motorola 大端字节序示意图</title>
  <desc id="desc">以十六位原始值 0x1234 为例，高字节 0x12 位于 Data 0，低字节 0x34 位于 Data 1。</desc>

  <rect width="960" height="500" rx="24" fill="#f8fafc"/>
  <rect x="1" y="1" width="958" height="498" rx="23" fill="none" stroke="#cbd5e1" stroke-width="2"/>

  <text x="48" y="62" fill="#0f172a" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">
    Motorola（Big Endian）字节序
  </text>
  <text x="48" y="96" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">
    示例：16 位原始值 Raw = 0x1234
  </text>

  <rect x="48" y="130" width="390" height="222" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="76" y="166" fill="#1e3a8a" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">
    总线中的字节排列
  </text>

  <rect x="76" y="196" width="146" height="104" rx="14" fill="#2563eb"/>
  <text x="149" y="226" fill="#dbeafe" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    Data[0]
  </text>
  <text x="149" y="265" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700">
    0x12
  </text>
  <text x="149" y="288" fill="#dbeafe" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">
    高有效字节 MSB
  </text>

  <path d="M235 248H270" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M262 239L273 248L262 257" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="286" y="196" width="124" height="104" rx="14" fill="#0ea5e9"/>
  <text x="348" y="226" fill="#e0f2fe" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    Data[1]
  </text>
  <text x="348" y="265" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace" font-size="34" font-weight="700">
    0x34
  </text>
  <text x="348" y="288" fill="#e0f2fe" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">
    低有效字节 LSB
  </text>

  <text x="76" y="330" fill="#334155" font-family="Consolas, 'Microsoft YaHei', monospace" font-size="18">
    Raw = (Data[0] &lt;&lt; 8) | Data[1]
  </text>

  <rect x="466" y="130" width="446" height="222" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="494" y="166" fill="#1e3a8a" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">
    单个字节内的位
  </text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <g fill="#64748b" font-size="14">
      <text x="526" y="205">Bit 7</text>
      <text x="576" y="205">Bit 6</text>
      <text x="626" y="205">Bit 5</text>
      <text x="676" y="205">Bit 4</text>
      <text x="726" y="205">Bit 3</text>
      <text x="776" y="205">Bit 2</text>
      <text x="826" y="205">Bit 1</text>
      <text x="876" y="205">Bit 0</text>
    </g>

    <g stroke="#bfdbfe" stroke-width="2">
      <rect x="502" y="220" width="48" height="58" rx="6" fill="#dbeafe"/>
      <rect x="552" y="220" width="48" height="58" rx="6" fill="#e0f2fe"/>
      <rect x="602" y="220" width="48" height="58" rx="6" fill="#dbeafe"/>
      <rect x="652" y="220" width="48" height="58" rx="6" fill="#e0f2fe"/>
      <rect x="702" y="220" width="48" height="58" rx="6" fill="#dbeafe"/>
      <rect x="752" y="220" width="48" height="58" rx="6" fill="#e0f2fe"/>
      <rect x="802" y="220" width="48" height="58" rx="6" fill="#dbeafe"/>
      <rect x="852" y="220" width="48" height="58" rx="6" fill="#e0f2fe"/>
    </g>

    <g fill="#0f172a" font-family="Consolas, monospace" font-size="22" font-weight="700">
      <text x="526" y="257">b7</text>
      <text x="576" y="257">b6</text>
      <text x="626" y="257">b5</text>
      <text x="676" y="257">b4</text>
      <text x="726" y="257">b3</text>
      <text x="776" y="257">b2</text>
      <text x="826" y="257">b1</text>
      <text x="876" y="257">b0</text>
    </g>
  </g>

  <path d="M516 305H886" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M878 296L889 305L878 314" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="701" y="332" fill="#475569" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">
    从高有效位到低有效位
  </text>

  <rect x="48" y="382" width="864" height="82" rx="16" fill="#eff6ff"/>
  <circle cx="82" cy="423" r="18" fill="#2563eb"/>
  <text x="82" y="430" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700">i</text>
  <text x="116" y="414" fill="#1e3a8a" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">
    Motorola 多字节信号先放高有效字节，再放低有效字节。
  </text>
  <text x="116" y="441" fill="#475569" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    Start Bit 的编号方式可能因 DBC 工具或项目矩阵而不同，解析时必须以当前协议定义为准。
  </text>
</svg>
